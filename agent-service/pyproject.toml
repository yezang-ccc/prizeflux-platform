[project]
name = "prizeflux-agent"
version = "0.1.0"
description = "A bounded, read-only AI copilot for the PrizeFlux platform."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
dependencies = [
    "alembic>=1.14,<2",
    "asyncmy>=0.2,<1",
    "cryptography>=44,<47",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=1.0,<2",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
local-embedding = ["fastembed==0.8.1"]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
    "testcontainers>=4.10,<5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prizeflux_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["mysql: opt-in MySQL 8.4 integration and multi-process tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
