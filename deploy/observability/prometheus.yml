global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - alert-rules.yml

scrape_configs:
  - job_name: prizeflux-campaign
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [campaign:8081]
    basic_auth:
      username: prizeflux-scraper
      password_file: /run/secrets/campaign_metrics_password

  - job_name: prizeflux-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [worker:8084]
    basic_auth:
      username: prizeflux-scraper
      password_file: /run/secrets/worker_metrics_password
