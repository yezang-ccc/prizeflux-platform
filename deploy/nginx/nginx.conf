worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;
    sendfile on;
    keepalive_timeout 65s;
    server_tokens off;

    client_body_temp_path /tmp/nginx/client_temp 1 2;
    proxy_temp_path /tmp/nginx/proxy_temp 1 2;
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 2s;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 1m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 35s;

        set $campaign_backend campaign:8081;
        set $legacy_ai_backend legacy-ai:8082;
        set $agent_backend agent:8083;

        location = /health/proxy {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ^~ /api/ {
            proxy_pass http://$campaign_backend$request_uri;
        }

        location ^~ /ai-api/ {
            rewrite ^/ai-api/(.*)$ /$1 break;
            proxy_pass http://$legacy_ai_backend$uri$is_args$args;
        }

        location ^~ /agent-api/api/ai/v2/runs/ {
            rewrite ^/agent-api/(.*)$ /$1 break;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 190s;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Accel-Buffering no always;
            proxy_pass http://$agent_backend$uri$is_args$args;
        }

        location ^~ /agent-api/ {
            rewrite ^/agent-api/(.*)$ /$1 break;
            proxy_pass http://$agent_backend$uri$is_args$args;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
