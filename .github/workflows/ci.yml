name: Backend CI

# 这里只定义“未来推送到 GitHub 后要执行什么”。工作流文件存在不代表它已经在远程运行过。
on:
  push:
  pull_request:

# 本工作流只需要检出和读取源码。显式声明后，其他未写出的 GITHUB_TOKEN 权限均为 none。
permissions:
  contents: read

jobs:
  backend-verify:
    # MySQL Testcontainers 需要可用的 Linux Docker daemon；GitHub Linux runner 提供该环境。
    runs-on: ubuntu-latest

    steps:
      # 固定到 actions/checkout v4 对应的完整提交 SHA，避免可变 tag 被悄悄移动。
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # 固定到 actions/setup-java v4 对应的完整提交 SHA；CI 不依赖运行器预装的 Java 版本。
      - name: Set up Temurin JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          # 根 POM 与子模块 POM 的变更都应使 Maven 依赖缓存重新计算。
          cache-dependency-path: |
            backend/pom.xml
            backend/*/pom.xml

      - name: Validate Maven reactor
        working-directory: backend
        run: bash ./mvnw -DskipTests validate

      - name: Run backend tests
        working-directory: backend
        run: bash ./mvnw test

      # 本步骤不需要真实密码；脚本只输出命中的文件和规则类型，不输出匹配到的文本。
      - name: Check tracked files for likely secrets
        shell: pwsh
        run: ./scripts/check-secrets.ps1
